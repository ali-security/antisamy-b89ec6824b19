# Authored by agentic-sealer: upstream (nahsra/antisamy 1.5.8) ships no CI.
# Mirrors the release toolchain read off the published jar manifest
# (Created-By: Apache Maven 3.5.3, Build-Jdk: 1.8.0_172) and pom.xml
# (maven-compiler-plugin source/target 1.7, surefire 2.22.1, JUnit 4.12).
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.5.3
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.5.3/binaries/apache-maven-3.5.3-bin.tar.gz -o /tmp/maven.tgz
          tar -xzf /tmp/maven.tgz -C /tmp
          echo "/tmp/apache-maven-3.5.3/bin" >> "$GITHUB_PATH"

      - name: Build and test
        run: |
          mvn -v
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -e clean package -Dmaven.javadoc.skip=true -Dtest="${{ inputs.test-filter }}" -DfailIfNoTests=false
          else
            mvn -B -e clean package -Dmaven.javadoc.skip=true
          fi

      - name: Test report summary
        if: always()
        run: |
          shopt -s nullglob
          for f in target/surefire-reports/TEST-*.xml; do
            grep -o '<testsuite [^>]*' "$f" | grep -oE '(name|tests|failures|errors|skipped)="[^"]*"' | tr '\n' ' '
            echo
            if grep -q '<skipped' "$f"; then grep -B1 -A1 '<skipped' "$f"; fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: antisamy-jar
          path: target/antisamy-1.5.8.jar
          if-no-files-found: error
